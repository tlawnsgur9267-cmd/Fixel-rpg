<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>라스트 월 v1</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#eee;font:14px system-ui}main{max-width:1100px;margin:auto;padding:8px}header,nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}button{background:linear-gradient(#354b60,#203044);color:white;border:1px solid #71859b;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;display:block;border:1px solid #64796b;border-radius:9px;background:#263e30}#heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.hero{padding:7px;background:#202d3b;border:1px solid;border-radius:7px;min-width:0}small{color:#b8c7d4}dialog{background:#172536;color:white;border:1px solid #b49b65;border-radius:12px;width:min(95vw,650px);max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}#notice{color:#f6d48a;min-height:20px} @media(max-width:500px){button{padding:7px;font-size:12px}.hero{font-size:11px}}</style><main><header><b>⚔ 라스트 월</b><span id="hud"></span></header><canvas id="c" width="960" height="420"></canvas><nav><button onclick="start()">웨이브 시작</button><button onclick="shop()">영웅 상점</button><button onclick="roster()">영웅 관리</button><button onclick="speed=speed===1?2:1;this.textContent=speed+'배속'">1배속</button><button onclick="repair()">성벽 수리 80G</button><button onclick="reset()">새 게임</button></nav><div id="notice"></div><div id="heroes"></div></main><dialog id="modal"><div id="content"></div><button onclick="modal.close()">닫기</button></dialog><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),modal=$('modal'),content=$('content');const grades=['일반','고급','레어','에픽','유니크','전설','신화'],colors=['#b8c0c5','#67d68b','#69aaff','#bc83ff','#ffad55','#ff5353','#ffe071'],jobs=['전사','도적','마법사','엘프 궁수','드워프'],magic=j=>j===2||j===4,skills=[['회전 참격','대지 분쇄','천검 폭풍'],['급소 찌르기','그림자 연격','죽음의 표식'],['화염구','서리 폭풍','메테오'],['연사','관통 화살','별빛 화살비'],['마력 폭탄','비전 포탑','룬 대폭발']],keys=['물리공격력','마법공격력','치명타확률','치명타피해','방어력관통','마법방어력관통','방어무시데미지','마법방어무시데미지','공격속도','최종데미지 상승'];let gold=500,wave=1,hp=1000,units=[],slots=[],enemies=[],fx=[],active=false,time=0,spawn=0,boss=false,speed=1,last=0,uid=0;const rnd=(a,b)=>a+Math.random()*(b-a),fmt=n=>Math.round(n).toLocaleString();function make(r,j){let opts=[];let pool=keys.map((_,i)=>i);for(let i=0;i<r;i++){let k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];opts.push([k,Math.round(rnd(3,8)*(r+1))])}return{id:++uid,r,j,opts,lv:1,cd:0,sc:[0,0,0]}}function stats(u){let a=[magic(u.j)?0:Math.round(24*1.65**u.r),magic(u.j)?Math.round(24*1.65**u.r):0,5,150,0,0,0,0,1+u.r*.16,0];for(let [k,v] of u.opts)a[k]+=k===8?v/100:v;let l=u.lv;a[u.j===0?6:u.j===1?2:u.j===3?8:7]+=u.j===3?l*.035:l*2;return a}function damage(u,e,m=1){let a=stats(u),z=magic(u.j),crit=Math.random()*100<Math.min(100,a[2]),base=a[z?1:0]*m*100/(100+e[z?'md':'def']*(1-Math.min(100,a[z?5:4])/100));return (base*(crit?(a[3]+Math.max(0,a[2]-100))/100:1)+a[z?7:6])*(1+a[9]/100)}function say(s){$('notice').textContent=s}function init(){units=[make(0,0),make(0,3)];slots=units.map(u=>u.id);render()}function render(){$('hud').textContent=`WAVE ${wave} · ${active?Math.max(0,Math.ceil(30-time))+'초':'대기'} · ${fmt(gold)} G · 성벽 ${fmt(hp)}/1000`;$('heroes').innerHTML=Array.from({length:4},(_,i)=>{let u=units.find(x=>x.id===slots[i]);return u?`<div class="hero" style="border-color:${colors[u.r]}"><b>${grades[u.r]} ${jobs[u.j]}</b><br>스킬 Lv.${u.lv}<br><button onclick="detail(${u.id})">상세 / 강화</button></div>`:'<div class="hero">빈 출전 슬롯</div>'}).join('')}function show(s){content.innerHTML=s;if(!modal.open)modal.showModal()}function shop(){show(`<h2>영웅 소환</h2><p>보유 ${fmt(gold)} G</p><button onclick="summon(1)">1회 100G</button> <button onclick="summon(10)">10회 1000G</button><p>일반 60% · 고급 25% · 레어 10% · 에픽 3.5% · 유니크 1.2% · 전설 0.27% · 신화 0.03%</p><div id="results"></div>`)}function summon(n){if(gold<n*100){say('골드 부족');return}gold-=n*100;let out=[];for(let i=0;i<n;i++){let x=Math.random()*100,r=[60,85,95,98.5,99.7,99.97,100].findIndex(v=>x<v),u=make(r,Math.floor(Math.random()*5));units.push(u);out.push(u);if(slots.length<4)slots.push(u.id)}shop();$('results').innerHTML=out.map(u=>`<p style="color:${colors[u.r]}">${grades[u.r]} ${jobs[u.j]} 획득!</p>`).join('');render()}function roster(){show('<h2>영웅 관리</h2>'+units.map(u=>`<p style="color:${colors[u.r]}">${grades[u.r]} ${jobs[u.j]} Lv.${u.lv} <button onclick="equip(${u.id})">${slots.includes(u.id)?'해제':'출전'}</button> <button onclick="detail(${u.id})">상세</button></p>`).join(''))}function equip(id){if(slots.includes(id))slots=slots.filter(x=>x!==id);else if(slots.length<4)slots.push(id);else{say('출전 슬롯 4개 제한');return}roster();render()}function detail(id){let u=units.find(x=>x.id===id),a=stats(u),n=u.r<2?1:u.r<5?2:3;show(`<h2 style="color:${colors[u.r]}">${grades[u.r]} ${jobs[u.j]}</h2><p>스킬 Lv.${u.lv} · 골드 ${fmt(gold)}</p>${keys.map((k,i)=>`<div>${k}: ${a[i].toFixed(i===8?2:0)}${[2,3,4,5,9].includes(i)?'%':''}</div>`).join('')}<h3>랜덤 옵션</h3>${u.opts.map(([k,v])=>`<div>${keys[k]} +${k===8?(v/100).toFixed(2):v}</div>`).join('')||'없음'}<h3>자동 스킬</h3>${skills[u.j].slice(0,n).map((s,i)=>`<p>${s} · ${[5,9,18][i]}초 · 공격력 ${[220,380,800][i]+u.lv*20}%</p>`).join('')}<button onclick="upgrade(${id})">스킬 강화 ${u.lv*60}G</button> <button onclick="roster()">영웅 목록</button>`)}function upgrade(id){let u=units.find(x=>x.id===id),cost=u.lv*60;if(gold>=cost){gold-=cost;u.lv++;render();detail(id)}else say('골드 부족')}function repair(){if(gold>=80&&hp<1000){gold-=80;hp=Math.min(1000,hp+250);render()}}function reset(){if(confirm('새 게임을 시작할까요?'))location.reload()}function start(){if(active||hp<=0)return;active=true;time=0;spawn=0;boss=false;enemies=[];say('전투 시작!')}function enemy(b){let type=Math.floor(Math.random()*3),h=(b?650:55)*1.22**(wave-1)*(type===2?1.5:1);enemies.push({x:940,y:rnd(65,365),hp:h,max:h,b,def:wave*5+(type===2?35:0),md:wave*5+(type===1?35:0),v:b?25:type===0?55:36,type})}function hit(u,e,m,area){let d=damage(u,e,m);e.hp-=d;fx.push({x:e.x,y:e.y,t:.35,col:colors[u.r],text:fmt(d),from:slots.indexOf(u.id)});if(area)for(let o of enemies)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<area)o.hp-=damage(u,o,m*.65)}function update(dt){if(!active)return;time+=dt;spawn-=dt;if(time<22&&spawn<=0){enemy(false);spawn=Math.max(.35,1.1-wave*.025)}if(time>=20&&!boss){boss=true;enemy(true);say('보스 등장!')}for(let e of enemies){if(e.x>210)e.x-=e.v*dt;else hp-=dt*(e.b?45:9)*(1+wave*.08)}for(let id of slots){let u=units.find(x=>x.id===id),a=stats(u),e=enemies.filter(x=>x.hp>0).sort((a,b)=>a.x-b.x)[0];u.cd-=dt;u.sc=u.sc.map(x=>x-dt);if(!e)continue;if(u.cd<=0){hit(u,e,1,u.j===0?55:0);u.cd=1/a[8]}let n=u.r<2?1:u.r<5?2:3;for(let i=0;i<n;i++)if(u.sc[i]<=0){let target=u.j===1?(enemies.find(x=>x.b&&x.hp>0)||e):e;hit(u,target,[2.2,3.8,8][i]+u.lv*.2,u.j===1?0:u.j===3?45:100+i*35);u.sc[i]=[5,9,18][i]}}for(let e of enemies)if(e.hp<=0)gold+=e.b?100+wave*15:12+wave*2;enemies=enemies.filter(e=>e.hp>0);if(hp<=0){hp=0;active=false;say('성벽 파괴! 새 게임으로 재도전')}else if(time>=30){if(enemies.length){hp=Math.max(0,hp-enemies.reduce((s,e)=>s+(e.b?150:20),0));say('시간 초과: 남은 적이 성벽에 피해를 입혔어.')}else say('웨이브 클리어!');active=false;enemies=[];if(hp>0){gold+=80+wave*10;wave++}else say('성벽 파괴!')}}
function draw(){let bg=g.createLinearGradient(0,0,0,420);bg.addColorStop(0,'#38583d');bg.addColorStop(1,'#192f29');g.fillStyle=bg;g.fillRect(0,0,960,420);for(let i=0;i<80;i++){let x=(i*137)%960,y=(i*79)%420;g.fillStyle='#ffffff09';g.fillRect(x,y,18,3)}g.fillStyle='#86785a';g.fillRect(210,40,750,340);g.fillStyle='#9b8a68';for(let i=0;i<15;i++)g.fillRect(220+i*51,42,2,336);g.fillStyle='#4c5157';g.fillRect(170,0,40,420);for(let y=0;y<420;y+=28){g.fillStyle='#a3a7a1';g.fillRect(170,y,37,25);g.fillStyle='#686e70';g.fillRect(195,y+4,12,21);g.fillStyle='#c5c7bd';g.fillRect(170,y,37,4)}for(let i=0;i<4;i++){let y=65+i*96,u=units.find(x=>x.id===slots[i]);g.fillStyle='#111b2288';g.beginPath();g.ellipse(115,y+20,27,11,0,0,7);g.fill();if(!u)continue;g.fillStyle=colors[u.r];g.beginPath();g.arc(115,y,27,0,7);g.strokeStyle=colors[u.r];g.stroke();g.fillStyle=['#7895aa','#45465d','#8567ad','#5d9669','#ad7950'][u.j];g.fillRect(100,y-4,30,27);g.fillStyle='#e4b894';g.beginPath();g.arc(115,y-12,12,0,7);g.fill();g.font='24px sans-serif';g.fillText(['⚔','🗡','✦','🏹','⚒'][u.j],130,y+7);g.font='12px sans-serif';g.fillStyle=colors[u.r];g.fillText(jobs[u.j],82,y+39)}for(let e of enemies){let r=e.b?31:15;g.fillStyle='#0005';g.beginPath();g.ellipse(e.x,e.y+r*.7,r*1.3,r*.5,0,0,7);g.fill();let grad=g.createRadialGradient(e.x-r*.3,e.y-r*.4,1,e.x,e.y,r);grad.addColorStop(0,e.b?'#ff9871':e.type===1?'#c1a2ec':'#a3c56c');grad.addColorStop(1,e.b?'#762b35':'#364d36');g.fillStyle=grad;g.beginPath();g.arc(e.x,e.y,r,0,7);g.fill();g.fillStyle='#ffdf80';g.fillRect(e.x-r*.6,e.y-4,5,4);g.fillRect(e.x+r*.2,e.y-4,5,4);g.fillStyle='#311e24';g.fillRect(e.x-r,e.y-r-10,r*2,5);g.fillStyle='#e65a50';g.fillRect(e.x-r,e.y-r-10,r*2*Math.max(0,e.hp/e.max),5);if(e.b){g.fillStyle='#ffe0a1';g.font='bold 14px sans-serif';g.fillText('BOSS',e.x-20,e.y-r-15)}}for(let f of fx){g.globalAlpha=Math.min(1,f.t*4);g.strokeStyle=f.col;g.lineWidth=2;g.beginPath();g.moveTo(150,65+f.from*96);g.lineTo(f.x,f.y);g.stroke();g.beginPath();g.arc(f.x,f.y,18+(0.35-f.t)*65,0,7);g.stroke();g.fillStyle='#fff1c7';g.font='bold 16px sans-serif';g.fillText(f.text,f.x-15,f.y-20);g.globalAlpha=1}g.fillStyle='#111a24';g.fillRect(12,8,145,12);g.fillStyle='#68c57c';g.fillRect(12,8,145*hp/1000,12)}let hudTimer=0;function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt*speed);for(let f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);draw();hudTimer+=dt;if(hudTimer>.25){hudTimer=0;$('hud').textContent=`WAVE ${wave} · ${active?Math.max(0,Math.ceil(30-time))+'초':'대기'} · ${fmt(gold)} G · 성벽 ${fmt(hp)}/1000`}requestAnimationFrame(loop)}init();requestAnimationFrame(loop);
</script></html>
