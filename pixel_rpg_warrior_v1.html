<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>픽셀 전사 RPG</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#eee;font:14px system-ui}main{max-width:640px;margin:auto;padding:12px}h2{margin:8px 0;color:#fcd34d}.box{background:#1f2937;border:1px solid #475569;border-radius:12px;padding:12px;margin:9px 0}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.meter{height:10px;background:#374151;border-radius:9px;overflow:hidden;margin:4px 0 9px}.fill{height:100%;width:100%}canvas{width:100%;image-rendering:pixelated;border-radius:9px;background:#32674a}button{background:#334155;color:white;border:1px solid #64748b;border-radius:9px;padding:11px 8px;font-weight:700;min-height:43px}button:active{background:#64748b}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.active{background:#854d0e}#log{max-height:160px;overflow:auto;font-size:12px;line-height:1.7}.item{border-top:1px solid #475569;padding:8px 0;display:flex;justify-content:space-between;align-items:center}.muted{color:#94a3b8;font-size:12px}.rare{color:#60a5fa}.heroic{color:#c084fc}.legendary{color:#fbbf24}</style></head><body><main><h2>⚔️ 픽셀 전사 RPG <small>v1</small></h2><div class="box"><div class="stats"><b id="level"></b><b id="gold"></b><b id="attackStat"></b><b id="defStat"></b></div><div>❤️ <span id="hpLabel"></span><div class="meter"><div class="fill" id="hpFill" style="background:#ef4444"></div></div></div><div>🔵 <span id="mpLabel"></span><div class="meter"><div class="fill" id="mpFill" style="background:#3b82f6"></div></div></div><div>✨ <span id="xpLabel"></span><div class="meter"><div class="fill" id="xpFill" style="background:#a3e635"></div></div></div></div><div class="box"><div id="area"></div><canvas id="scene" width="400" height="230"></canvas><div id="enemyLabel" style="text-align:center"></div></div><div class="box buttons"><button id="hit" class="active">⚔️ 공격</button><button id="skill">💥 강타 (8MP)</button><button id="auto">▶ 자동 OFF</button><button id="potion">🧪 물약</button><button id="rest">🏕️ 휴식</button><button id="next">🧭 다음 지역</button></div><div class="box"><div class="buttons"><button id="tabLog">전투 기록</button><button id="tabBag">인벤토리</button><button id="tabForge">대장간</button></div><div id="panel" style="padding-top:10px"></div></div><div class="muted">자동 사냥으로 레벨을 올리고, 장비를 얻어 강화하세요. 강화 실패 시 +단계만 1 하락하며 장비는 사라지지 않습니다. 브라우저 탭을 닫으면 진행 상황이 초기화됩니다.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const ctx=$('scene').getContext('2d');const zones=[['초록 들판','슬라임',32,5,9,5],['버섯 숲','독버섯',75,11,20,12],['잊힌 폐허','해골 병사',135,19,38,22],['용암 동굴','화염 정령',230,29,65,35]];const templates=[['철검','weapon',4,0,'common'],['사냥꾼 검','weapon',8,0,'rare'],['기사 대검','weapon',15,0,'heroic'],['용살자 검','weapon',27,0,'legendary'],['가죽 갑옷','armor',0,3,'common'],['수호자 갑옷','armor',0,7,'rare'],['기사 갑옷','armor',0,13,'heroic'],['용비늘 갑옷','armor',0,23,'legendary']];let s={lv:1,xp:0,hp:100,mp:30,gold:0,potions:4,zone:0,enemy:32,auto:false,weapon:{name:'낡은 검',type:'weapon',atk:3,def:0,rarity:'common',plus:0},armor:{name:'천 갑옷',type:'armor',atk:0,def:1,rarity:'common',plus:0},bag:[]},tab='log',logs=['모험 시작! 슬라임을 처치해 보세요.'];const maxHP=()=>80+s.lv*20,maxMP=()=>20+s.lv*10,need=()=>20+(s.lv-1)*17,atk=()=>6+s.lv*2+s.weapon.atk+s.weapon.plus*3,def=()=>s.lv+s.armor.def+s.armor.plus*2;function log(t){logs.unshift(t);logs=logs.slice(0,50)}function render(){let z=zones[s.zone];$('level').textContent='Lv.'+s.lv;$('gold').textContent='🪙 '+s.gold+'G';$('attackStat').textContent='공격 '+atk();$('defStat').textContent='방어 '+def();for(let [k,v,m] of [['hp',s.hp,maxHP()],['mp',s.mp,maxMP()],['xp',s.xp,need()]]){$(k+'Label').textContent=k.toUpperCase()+' '+v+' / '+m;$(k+'Fill').style.width=Math.max(0,Math.min(100,v/m*100))+'%'}$('area').textContent='📍 '+z[0]+' | 전사 '+s.weapon.name+' +'+s.weapon.plus+' / '+s.armor.name+' +'+s.armor.plus;$('enemyLabel').textContent=z[1]+' HP '+s.enemy+' / '+z[2];$('auto').textContent='▶ 자동 '+(s.auto?'ON':'OFF');$('potion').textContent='🧪 물약 '+s.potions;draw();renderPanel()}function draw(){const c=ctx,z=zones[s.zone];c.fillStyle=['#397451','#385c39','#5d5a56','#813d28'][s.zone];c.fillRect(0,0,400,230);for(let i=0;i<32;i++){c.fillStyle=i%3?'#ffffff18':'#163c2980';c.fillRect((i*83)%400,(i*59)%230,5,4)}for(let i=0;i<4;i++){let x=i*105+15;c.fillStyle='#6b4428';c.fillRect(x,35,9,32);c.fillStyle='#166534';c.fillRect(x-9,23,28,25)}c.fillStyle='#192537';c.fillRect(98,140,28,41);c.fillStyle='#f2c48b';c.fillRect(102,121,20,21);c.fillStyle='#b91c1c';c.fillRect(98,118,28,8);c.fillStyle='#e2e8f0';c.fillRect(127,142,5,40);c.fillStyle=['#8ad967','#ae76d4','#ddd4bd','#f97316'][s.zone];c.fillRect(277,134,53,42);c.fillRect(285,123,37,17);c.fillStyle='#fff';c.fillRect(291,142,7,7);c.fillRect(310,142,7,7);c.fillStyle='#111';c.fillRect(297,157,15,4);c.fillStyle='#fff';c.font='14px system-ui';c.fillText('전사',95,199);c.fillText(z[1],270,199);c.fillStyle='#111827';c.fillRect(260,103,90,9);c.fillStyle='#ef4444';c.fillRect(261,104,88*Math.max(0,s.enemy/z[2]),7)}function renderPanel(){let p=$('panel');p.replaceChildren();if(tab==='log'){p.innerHTML=logs.map(x=>'<div>› '+x+'</div>').join('');return}if(tab==='bag'){p.innerHTML='<b>보유 장비 '+s.bag.length+'개</b>';if(!s.bag.length)p.innerHTML+='<p class="muted">몬스터를 사냥해 장비를 획득하세요.</p>';s.bag.forEach((item,i)=>{let d=document.createElement('div');d.className='item';let span=document.createElement('span');span.textContent=item.name+' +'+item.plus+' ('+(item.type==='weapon'?'공격 '+item.atk:'방어 '+item.def)+')';span.className=item.rarity;let b=document.createElement('button');b.textContent='착용';b.onclick=()=>{let it=s.bag.splice(i,1)[0],old=s[it.type];s[it.type]=it;s.bag.push(old);log(it.name+' 착용!');render()};d.append(span,b);p.append(d)});return}p.innerHTML='<b>대장간</b><p class="muted">강화 성공률은 단계가 높을수록 낮아집니다. 실패 시 단계 1 하락, 파괴 없음.</p>';for(let type of ['weapon','armor']){let it=s[type],cost=20+it.plus*25,d=document.createElement('div');d.className='item';let label=document.createElement('span');label.textContent=it.name+' +'+it.plus+' | 비용 '+cost+'G';let b=document.createElement('button');b.textContent='강화';b.onclick=()=>{if(s.gold<cost){log('골드가 부족합니다.');tab='log';render();return}s.gold-=cost;if(Math.random()<Math.max(.25,.78-it.plus*.08)){it.plus++;log(it.name+' 강화 성공! +'+it.plus)}else{it.plus=Math.max(0,it.plus-1);log(it.name+' 강화 실패! +'+it.plus)}render()};d.append(label,b);p.append(d)}}function drop(){let r=Math.random(),rarity=r<.56?0:r<.84?1:r<.97?2:3,type=Math.random()<.55?'weapon':'armor',t=templates[(type==='weapon'?0:4)+rarity],it={name:t[0],type:t[1],atk:t[2],def:t[3],rarity:t[4],plus:0};s.bag.push(it);log('🎁 '+it.name+' 획득! ('+['일반','희귀','영웅','전설'][rarity]+')')}function fight(mult){if(s.hp<=1){log('체력이 부족합니다. 휴식하세요.');s.auto=false;render();return}if(mult>1){if(s.mp<8){log('MP 부족!');render();return}s.mp-=8}let z=zones[s.zone],damage=Math.max(1,Math.floor(atk()*mult+Math.random()*5));s.enemy=Math.max(0,s.enemy-damage);log(z[1]+'에게 '+damage+' 피해');if(s.enemy===0){s.xp+=z[4];s.gold+=z[5];log('✨ '+z[1]+' 처치! 경험치 '+z[4]+', '+z[5]+'G');if(Math.random()<.6)drop();while(s.xp>=need()){s.xp-=need();s.lv++;s.hp=maxHP();s.mp=maxMP();log('🎉 레벨 '+s.lv+' 달성!')}s.enemy=z[2]}else{let dmg=Math.max(1,z[3]-def()+Math.floor(Math.random()*4));s.hp=Math.max(1,s.hp-dmg);log(z[1]+' 반격 '+dmg+' 피해');if(s.hp<=1){s.auto=false;log('위험! 자동 사냥 중단.')}}render()}$('hit').onclick=()=>fight(1);$('skill').onclick=()=>fight(2.1);$('auto').onclick=()=>{s.auto=!s.auto;render()};$('potion').onclick=()=>{if(!s.potions){log('물약이 없습니다.');render();return}s.potions--;s.hp=Math.min(maxHP(),s.hp+50);s.mp=Math.min(maxMP(),s.mp+12);log('물약 사용! HP와 MP 회복');render()};$('rest').onclick=()=>{s.auto=false;s.hp=maxHP();s.mp=maxMP();log('휴식 완료! HP/MP 전부 회복');render()};$('next').onclick=()=>{s.zone=(s.zone+1)%zones.length;s.enemy=zones[s.zone][2];log(zones[s.zone][0]+' 입장!');render()};$('tabLog').onclick=()=>{tab='log';render()};$('tabBag').onclick=()=>{tab='bag';render()};$('tabForge').onclick=()=>{tab='forge';render()};setInterval(()=>{if(s.auto)fight(1)},1000);render()})();
</script></body></html>
