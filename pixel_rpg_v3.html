.xp>=need()){P.xp-=need();P.lv++;P.hp=maxhp();P.mp=maxmp();msg('레벨 '+P.lv+' 달성!')}}function roll(){let a=R();return a<.48?0:a<.75?1:a<.9?2:a<.97?3:a<.995?4:5}function title(i){return ['철제','비취','폭풍','심연','태양','용신','천상의'][i.r]+' '+['검','갑주','인장'][i.t]+' +'+i.p}function art(i){let c=colors[i.r],r=i.r;return `<svg viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="8" fill="#101824" stroke="${c}"/>${r>=3?`<circle cx="32" cy="32" r="24" fill="${c}" opacity=".16"/>`:''}${i.t===0?`<g transform="rotate(35 32 32)"><path d="M${28-r} 39 L${28-r} 14 L32 4 L${36+r} 14 L${36+r} 39Z" fill="${c}" stroke="#fff" stroke-width="1"/><path d="M32 9V39" stroke="#fff"/><path d="M${21-r} 40H${43+r}" stroke="${r>2?'#ffd26a':'#8996a0'}" stroke-width="5"/><path d="M32 42V55" stroke="#a87949" stroke-width="6"/>${r>=4?`<path d="M18 18L12 27L22 34M46 18L52 27L42 34" stroke="${c}" stroke-width="3" fill="none"/>`:''}</g>`:i.t===1?`<path d="M12 15L24 9L32 17L40 9L52 15L58 30L47 35L44 55H20L17 35L6 30Z" fill="${c}" stroke="#e7e7e7"/><path d="M32 19L43 32L32 48L21 32Z" fill="#26354b" stroke="#fff"/>`:`<circle cx="32" cy="38" r="15" fill="none" stroke="${c}" stroke-width="8"/><path d="M19 19L25 8H39L45 19L32 32Z" fill="${c}" stroke="#fff"/>`}${r>=5?`<path d="M7 10H17M12 5V15M48 52H58M53 47V57" stroke="${c}" stroke-width="2"/>`:''}</svg>`}function detail(i){$('details').innerHTML=art(i)+`<h2 style="color:${colors[i.r]}">${title(i)}</h2>${grades[i.r]} · ${types[i.t]}\n기본 능력치 +${stat(i)}\n치명타 확률 +${i.opts[0]}%\n최대 HP +${i.opts[1]*3}\n흡혈 +${i.opts[2]}% (무기 장착 시)\n획득 지역: ${name(i.s)}`;$('modal').showModal()}function drop(force=false){let r=roll();if(force)r=Math.max(2,r);let i=item(Math.floor(R()*3),r,stage);P.bag.push(i);msg(`${grades[r]} ${title(i)} 획득!`)}function enter(s){if(s>P.unlocked||s>29)return;town=false;stage=s;auto=false;kills=0;boss=false;mobs=[];x=200;y=180;target=null;for(let i=0;i<4;i++)make();tab='field';render();msg(name(s)+' 입장')}function home(){town=true;auto=false;target=n )return;P.shards-=10;i.r=6;msg('신화 승급 성공! 강화 단계 유지');save();render()}function btn(s,f,disabled=false){let b=document.createElement('button');b.textContent=s;b.disabled=disabled;b.onclick=f;return b}function add(el,s,f,d){el.append(btn(s,f,d))}function set(t){tab=t;render()}function render(){let c=$('controls'),n=$('nav'),v=$('view');c.innerHTML=n.innerHTML=v.innerHTML='';if(town){for(let [s,t] of [['🚪 사냥터','stages'],['🏠 여관','inn'],['🔨 대장간','forge'],['💎 신화 제단','myth'],['🏪 상점','shop'],['🔮 소환소','summon']])add(c,s,()=>set(t))}else{add(c,'⚔ 공격',()=>attack());add(c,'💥 회전베기',()=>attack(true));add(c,'자동사냥 '+(auto?'ON':'OFF'),()=>{auto=!auto;render()});add(c,'🧪 물약',potion);add(c,'👑 보스 소환',summonBoss);add(c,'🏠 마을 귀환',home)}for(let [s,t] of [['장비','bag'],['동료','party'],['길드','guild'],['저장','save']])add(n,s,()=>{if(t==='save'){save();msg('저장 완료')}else set(t)});if(tab==='town'){v.innerHTML='<b>은빛 마을</b><p>여관에서 쉬고, 장비를 강화하고, 동료를 영입하세요. 사냥터 입구에서 모험을 시작합니다.</p>'}if(tab==='field'){v.innerHTML='<b>'+name(stage)+'</b><p>화면을 터치하거나 드래그하여 이동하세요. 몬스터 8마리를 처치하면 보스를 소환할 수 있습니다.</p>'}if(tab==='stages'){for(let ch=0;ch<3;ch++){let h=document.createElement('p');h.textContent=(ch+1)+'장 · '+chapters[ch];v.append(h);let grid=document.createElement('div');grid.className='stage';for(let j=0;j<10;j++){let s=ch*10+j;add(grid,`${ch+1}-${j+1} ${P.cleared.includes(s)?'✓':s>P.unlocked?'🔒':''}`,()=>enter(s),s>P.unlocked)}v.append(grid)}v.append(document.createTextNode('다음 지역: '+name(P.unlocked)))}if(tab==='inn'){v.innerHTML='<p>여관 · 무료로 체력과 마력을 모두 회복합니다.</p>';add(v,'휴식하기',()=>{P.hp=maxhp();P.mp=maxmp();save();msg('완전히 회복했습니다')})}if(tab==='shop'){v.innerHTML='<p>골드로 모험 물품을 구매하세요.</p>';add(v,'물약 5개 · 60G',()=>{if(P.gold>=60){P.gold-=60;P.pot+=5;save();msg('물약 구매 완료')}else msg('골드 부족')});add(v,'소환권 1개 · 250G',()=>{if(P.gold>=250){P.gold-=250;P.tickets++;save();msg('소환권 구매 완료')}else msg('골드 부족')})}if(tab==='summon'){v.innerHTML='<p>소환권 '+P.tickets+'장 · 전사 / 주술사 / 도사 / 도적</p><small>등급 확률: 커먼 48%, 언커먼 27%, 레어 15%, 에픽 7%, 유니크 2.5%, 전설 0.5%</small><p>동료 최대 2명 동행</p>';add(v,'동료 1회 소환',summon)}if(tab==='party'){v.innerHTML='<p>동행 '+P.party.length+'/2 · 주술사 원거리 공격 / 도사 회복 / 도적 강력한 일격 / 전사 근접 공격</p>';for(let f of P.friends){let d=document.createElement('div');d.className='item';d.innerHTML=`<span style="color:${colors[f.r]}">${grades[f.r]} ${jobs[f.j]}</span>`;add(d,P.party.includes(f.id)?'해제':'동행',()=>{if(P.party.includes(f.id))P.party=P.party.filter(id=>id!==f.id);else if(P.party.length<2)P.party.push(f.id);else return msg('동료는 최대 2명');save();render()});v.append(d)}}if(tab==='guild'){v.innerHTML=`<b>모험가 기록</b><p>몬스터 ${P.kills}마리 · 보스 ${P.bosses}마리</p><p>개척 ${P.cleared.length}/30 · 신화 파편 ${P.shards}개</p><p>최초 클리어 보상: 소환권 1장, 추가 골드. 보스마다 신화 파편 2개.</p>`}if(['bag','forge','myth'].includes(tab)){v.innerHTML=tab==='myth'?'<p>전설 +20 이상 장비와 신화 파편 10개 필요. 보유 '+P.shards+'개.</p>':tab==='forge'?'<p>강화 실패 시 -1, 파괴 없음.</p>':'<p>장착 장비 / 가방</p>';for(let i of [...P.gear.filter(Boolean),...(tab==='bag'?P.bag:[])]){let equipped=P.gear.includes(i),d=document.createElement('div');d.className='item';d.innerHTML=art(i)+`<div class="info"><b style="color:${colors[i.r]}">${title(i)}</b><div class="tag">${grades[i.r]} · 능력치 ${stat(i)} ${equipped?'· 장착':''}</div></div>`;add(d,'옵션',()=>detail(i));if(tab==='bag'&&!equipped){add(d,'착용',()=>{P.bag=P.bag.filter(a=>a!==i);if(P.gear[i.t])P.bag.push(P.gear[i.t]);P.gear[i.t]=i;save();render()});add(d,'판매',()=>{P.bag=P.bag.filter(a=>a!==i);P.gold+=15*(i.r+1)**2+i.p*10;save();render()})}if(tab==='forge')add(d,`강화 ${40+i.p*25+i.r*20}G (${Math.round(Math.max(.35,.95-i.p*.025)*100)}%)`,()=>forge(i),!town);if(tab==='myth')add(d,'승급',()=>myth(i),!town||i.r!==5||i.p<20||P.shards<10);v.append(d)}}}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}function text(s,x,y,c='#fff',size=10){g.fillStyle=c;g.font=`bold ${size}px sans-serif`;g.textAlign='center';g.fillText(s,x,y)}function sprite(x,y,j,r=0){rect(x-10,y+10,20,4,'#10192388');rect(x-7,y-12,14,12,'#eac097');rect(x-9,y-16,18,6,colors[r]);rect(x-9,y,18,13,['#587aab','#8b55bb','#e4d7a2','#476d65'][j]);rect(x-6,y+13,5,6,'#263040');rect(x+2,y+13,5,6,'#263040');rect(x+10,y-4,3,20,colors[r]);if(r>=3){rect(x-13,y-5,2,2,colors[r]);rect(x+15,y-10,2,2,colors[r])}}function draw(){rect(0,0,400,240,town?'#526b49':['#315d43','#454958','#633b34'][Math.floor(stage/10)]);for(let i=0;i<100;i++)rect((i*73)%400,(i*47)%240,3,2,'#ffffff12');if(town){rect(0,105,400,35,'#b5a07a');rect(180,0,40,240,'#b5a07a');let buildings=[['여관',55,50,'inn'],['대장간',200,50,'forge'],['상점',345,50,'shop'],['소환소',55,175,'summon'],['신화 제단',200,175,'myth'],['사냥터',345,175,'stages']];for(let [s,a,b] of buildings){rect(a-30,b-18,60,38,'#c2a77c');rect(a-35,b-25,70,13,'#70464a');rect(a-7,b+4,14,16,'#44372e');text(s,a,b+34)}sprite(200,119,0,P.gear[0].r);return}for(let i=0;i<9;i++){let a=(i*97+13)%400,b=(i*61+25)%240;rect(a,b,7,16,'#594436');rect(a-7,b-12,22,18,['#204c36','#777984','#a84f30'][Math.floor(stage/10)])}for(let m of mobs){let s=m.b?19:10,col=m.b?'#f4a85c':['#80d978','#b9bac9','#f57c56'][Math.floor(stage/10)];rect(m.x-s,m.y-s,s*2,s*2,col);rect(m.x-s/2,m.y-3,4,4,'#17212c');rect(m.x+s/3,m.y-3,4,4,'#17212c');rect(m.x-16,m.y-s-8,32,4,'#17212c');rect(m.x-16,m.y-s-8,32*Math.max(0,m.h/m.max),4,'#ff7474');if(m.b)text('수호자',m.x,m.y-s-12,'#ffdd8b')}sprite(x,y,0,P.gear[0].r);P.party.forEach((id,k)=>{let f=P.friends.find(a=>a.id===id);if(f){sprite(x-25+k*50,y+23,f.j,f.r);text(jobs[f.j],x-25+k*50,y+48,colors[f.r])}});for(let f of fx)text(f.t,f.x,f.y-(.7-f.life)*30,'#ffe58a',13);text(name(stage),200,14);if(boss){let m=mobs.find(a=>a.b);if(m){rect(70,20,260,6,'#171b25');rect(70,20,260*m.h/m.max,6,'#ff795b')}}}function loop(n){let dt=Math.min(.05,(n-(last||n))/1000);last=n;if(!town){let near=mobs.slice().sort((a,b)=>dist(x,y,a.x,a.y)-dist(x,y,b.x,b.y))[0];let t=target||(auto&&near?near:null);if(t){let d=dist(x,y,t.x,t.y);if(d> (auto?30:3)){x=cl(x+(t.x-x)/d*Math.min(d,100*dt),12,388);y=cl(y+(t.y-y)/d*Math.min(d,100*dt),25,215)}}if(auto){attack();if(P.mp>=12&&mobs.filter(m=>dist(x,y,m.x,m.y)<70).length>=2)attack(true);if(P.hp<maxhp()*.3&&P.pot)potion();if(kills>=8&&!boss)summonBoss()}for(let m of mobs){let d=dist(x,y,m.x,m.y);if(d>24){m.x+=(x-m.x)/d*dt*(m.b?18:25);m.y+=(y-m.y)/d*dt*(m.b?18:25)}else if(n-m.hit>1200){m.hit=n;P.hp-=Math.max(1,Math.round((5+stage*2)*(m.b?2:1)-def()*.65))}}if(n-friendTime>850){friendTime=n;for(let id of P.party){let f=P.friends.find(a=>a.id===id);if(!f)continue;if(f.j===2){P.hp=Math.min(maxhp(),P.hp+5+f.r*5);continue}let m=mobs.find(a=>dist(x,y,a.x,a.y)<(f.j===1?145:70));if(m)damage(m,Math.round((8+P.lv*2+f.r*8)*(f.j===3?1.5:1)))}}if(n-spawn>1800){spawn=n;if(mobs.length<5&&!boss)make()}if(n-regen>2000){regen=n;P.mp=Math.min(maxmp(),P.mp+3)}if(P.hp<=0){P.gold=Math.max(0,P.gold-20);P.hp=Math.round(maxhp()*.5);home();msg('전투 패배 · 마을 귀환 · 20G 손실')}}fx=fx.filter(f=>(f.life-=dt)>0);if(n-saveTime>3000){saveTime=n;save()}$('stats').innerHTML=`<b>Lv.${P.lv} 전사</b> · 공격 ${atk()} · 방어 ${def()} · <span class="gold">${P.gold}G</span><br><small>HP ${Math.max(0,P.hp)}/${maxhp()} · MP ${P.mp}/${maxmp()}</small><div class="bar"><i style="width:${cl(P.hp/maxhp()*100,0,100)}%;background:#ed6978"></i></div><div class="bar"><i style="width:${P.mp/maxmp()*100}%;background:#65a9ff"></i></div><small>EXP ${P.xp}/${need()} · 물약 ${P.pot} · 소환권 ${P.tickets} ${town?'':'· 보스 조건 '+Math.min(kills,8)+'/8'}</small><div class="bar"><i style="width:${P.xp/need()*100}%;background:#eac66e"></i></div>`;draw();requestAnimationFrame(loop)}function point(e){let b=C.getBoundingClientRect();return {x:(e.clientX-b.left)*400/b.width,y:(e.clientY-b.top)*240/b.height}}C.onpointerdown=e=>{let p=point(e);if(town){let col=p.x<125?0:p.x<275?1:2;set((p.y<105?['inn','forge','shop']:['summon','myth','stages'])[col]);return}auto=false;target=p;C.setPointerCapture(e.pointerId);render()};C.onpointermove=e=>{if(!town&&C.hasPointerCapture(e.pointerId))target=point(e)};C.onpointerup=()=>{};C.onpointercancel=()=>{target=null};window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});render();requestAnimationFrame(loop);
</script></html>
