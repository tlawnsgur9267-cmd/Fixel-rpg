&&(k===2||k===3))continue;if(a===p&&k===1&&/치유/.test(p.skill)){p.hp=Math.min(p.max,p.hp+p.max*.35);$('log').textContent=p.skill+' · 체력 회복';}else{let m=a===p&&k===1?2.2:1,d=hit(a,b,m)*(b===p&&guard?.45:1);b.hp=Math.max(0,b.hp-d);if(a===p&&p.r===2)p.hp=Math.min(p.max,p.hp+d*.15);fx={a:a===p?0:1,t:performance.now(),d,skill:a===p&&k===1,r:a.r};$('log').textContent=`${name(a)} ${a===p&&k===1?p.skill:'공격'} · ${d?fmt(d)+' 피해':'회피!'}`;}hud();await wait(550)}if(e.hp<=0){victory();return}if(p.hp<=0){mode='result';$('actions').hidden=true;p.hp=p.max;save();panel('<h2>전투 패배</h2><p>체력을 회복하고 초원으로 돌아갑니다.</p><button onclick="world()">돌아가기</button>');return}turn++;busy=false;document.querySelectorAll('#actions button').forEach(b=>b.disabled=false);$('log').textContent=`${turn}턴 · 행동을 선택하세요`;}const evos=[['스켈레톤 워리어','스켈레톤 나이트','데스나이트','데스로드','불멸의 군주'],['레이스','상급 악령','리치','아크리치','영혼의 지배자'],['구울','상급 구울','어보미네이션','재앙의 거인','불사의 재앙']];function victory(){mode='result';$('actions').hidden=true;let xp=12+e.lv*8,old={...p},notes=[];p.xp+=xp;while(p.xp>=need()&&p.lv<100){p.xp-=need();p.lv++;for(let k of ['max','atk','def','spd'])p[k]*=1+p.g/100;if(p.r===3)p.hp=Math.min(p.max,p.hp+p.max*.1);if(p.r===1&&[10,25,50,75,100][p.evo]===p.lv){let line=p.line??['스켈레톤','벤시','좀비'].indexOf(p.job);p.line=line;p.job=evos[line][p.evo];let mult=[1.5,2,3,4,5][p.evo++];for(let k of ['max','atk','def','spd'])p[k]*=mult;p.skill=['망자의 검기','영혼 폭풍','감염 폭발'][line];notes.push('진화: '+p.job)}p.hp=p.max}p.hp=Math.min(p.max,p.hp+p.max*.15);let loot=drop3();if(loot)notes.push(loot);save();hud();panel(`<h2>전투 승리</h2><p>경험치 +${xp}</p>${p.lv>old.lv?`<h3>Lv.${old.lv} → Lv.${p.lv}</h3>체력 +${fmt(p.max-old.max)} · 공격 +${fmt(p.atk-old.atk)}<br>방어 +${fmt(p.def-old.def)} · 속도 +${fmt(p.spd-old.spd)}`:''}<p>${notes.join('<br>')}</p><button onclick="world()">초원으로 돌아가기</button>`)}
