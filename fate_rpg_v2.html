const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let W,H,D,mode='title',p=null,e=null,dist=0,threshold=250,dx=0,dy=0,last=0,busy=false,guard=false,turn=0,fx=null;const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),fmt=n=>n>=1e9?n.toExponential(2):Math.round(n).toLocaleString('ko-KR');const races=[['휴먼',[['용사',.1,1,'성검 심판'],['신녀',.9,.45,'신성 치유'],['기사',24.75,.08,'방패 강타'],['마법사',24.75,.08,'화염구'],['궁사',24.75,.08,'관통 화살'],['힐러',24.75,.08,'치유']]],['언데드',[['스켈레톤',34,.06,'뼈 투척'],['벤시',33,.06,'죽음의 비명'],['좀비',33,.06,'부패 강타']]],['뱀파이어',[['퀸',.05,1.1,'혈계 강림'],['킹',.05,1.1,'피의 폭풍'],['공작',1.9,.35,'혈마검'],['백작',8,.22,'혈액 폭발'],['자작',20,.12,'박쥐 습격'],['종자',70,.07,'흡혈']]],['엘프',[['족장',.1,.95,'세계수 심판'],['장로',4.9,.35,'정령 소환'],['하이엘프',20,.16,'정령 화살'],['엘프',75,.07,'바람 화살']]],['드워프',[['족장',.1,.9,'대지 붕괴'],['장로',4.9,.3,'룬 마법'],['대장장이',25,.13,'화염 망치'],['전투원',70,.07,'강철 강타']]]];const colors=['#c6a67a','#a9b8a0','#9c4560','#76ad78','#a77c4f'];function roll(exclude=-1){let r=ri(0,4);while(r===exclude)r=ri(0,4);let x=rnd(0,100),j=races[r][1].find(a=>(x-=a[1])<0)||races[r][1].at(-1),m=j[2],v=(a,b)=>Math.max(1,Math.round(rnd(a,b)*m)),hp=v(100,300);let z=rnd(0,100),range=z<50?[1,10]:z<80?[10,20]:z<95?[20,40]:z<99?[40,60]:z<99.9?[60,80]:z<99.999?[80,99.99]:[100,100];return{r,job:j[0],skill:j[3],hp,max:hp,atk:v(30,100),def:v(30,100),spd:v(30,100),g:Math.round(rnd(...range)*100)/100,lv:1,x:3000,y:2400,xp:0,evo:0}}function name(a){return races[a.r][0]+' '+a.job}function save(){try{localStorage.setItem('fate_v1',JSON.stringify(p))}catch{}}function panel(html){$('panel').innerHTML=html;$('overlay').hidden=false}function title(){let has=false;try{has=!!JSON.parse(localStorage.getItem('fate_v1'))}catch{}panel('<h1>FATE RPG v2.0</h1><p>운명의 탄생 · 태초의 초원</p><button onclick="birth()">게임 시작</button> '+(has?'<button onclick="resume()">이어하기</button>':''))}function resume(){try{p=JSON.parse(localStorage.getItem('fate_v1'));world()}catch{title()}}function stats(a){return `체력 .textContent=p.skill+' · 체력 회복';}else{let m=a===p&&k===1?2.2:1,d=hit(a,b,m)*(b===p&&guard?.45:1);b.hp=Math.max(0,b.hp-d);if(a===p&&p.r===2)p.hp=Math.min(p.max,p.hp+d*.15);fx={a:a===p?0:1,t:performance.now(),d};$('log').textContent=`${name(a)} ${a===p&&k===1?p.skill:'공격'} · ${d?fmt(d)+' 피해':'회피!'}`;}hud();await wait(550)}if(e.hp<=0){victory();return}if(p.hp<=0){mode='result';$('actions').hidden=true;p.hp=p.max;save();panel('<h2>전투 패배</h2><p>체력을 회복하고 초원으로 돌아갑니다.</p><button onclick="world()">돌아가기</button>');return}turn++;busy=false;document.querySelectorAll('#actions button').forEach(b=>b.disabled=false);$('log').textContent=`${turn}턴 · 행동을 선택하세요`;}const evos=[['스켈레톤 워리어','스켈레톤 나이트','데스나이트','데스로드','불멸의 군주'],['레이스','상급 악령','리치','아크리치','영혼의 지배자'],['구울','상급 구울','어보미네이션','재앙의 거인','불사의 재앙']];function victory(){mode='result';$('actions').hidden=true;let xp=12+e.lv*8,old={...p},notes=[];p.xp+=xp;while(p.xp>=need()&&p.lv<100){p.xp-=need();p.lv++;for(let k of ['max','atk','def','spd'])p[k]*=1+p.g/100;if(p.r===3)p.hp=Math.min(p.max,p.hp+p.max*.1);if(p.r===1&&[10,25,50,75,100][p.evo]===p.lv){let line=p.line??['스켈레톤','벤시','좀비'].indexOf(p.job);p.line=line;p.job=evos[line][p.evo];let mult=[1.5,2,3,4,5][p.evo++];for(let k of ['max','atk','def','spd'])p[k]*=mult;p.skill=['망자의 검기','영혼 폭풍','감염 폭발'][line];notes.push('진화: '+p.job)}p.hp=p.max}p.hp=Math.min(p.max,p.hp+p.max*.15);save();hud();panel(`<h2>전투 승리</h2><p>경험치 +${xp}</p>${p.lv>old.lv?`<h3>Lv.${old.lv} → Lv.${p.lv}</h3>체력 +${fmt(p.max-old.max)} · 공격 +${fmt(p.atk-old.atk)}<br>방어 +${fmt(p.def-old.def)} · 속도 +${fmt(p.spd-old.spd)}`:''}<p>${notes.join('<br>')}</p><button onclick="world()">초원으로 돌아가기</button>`)}

));p.y=Math.max(20,Math.min(4780,p.y+dy*speed*dt));dist+=Math.hypot(p.x-ox,p.y-oy);if(dist>threshold)encounter()}if((mode==='world'||mode==='sheet')&&p){let cx=Math.max(0,Math.min(6000-W,p.x-W/2)),cy=Math.max(0,Math.min(4800-H,p.y-H/2));terrain(cx,cy);actor(p,p.x-cx,p.y-cy,1.15);label(name(p),p.x-cx,p.y-cy-43);rect(W-110,H-78,100,65,'#243d2acc');rect(W-110+p.x/6000*100,H-78+p.y/4800*65,4,4,'#ffe59c')}else if((mode==='battle'||mode==='result')&&e){terrain(1000,1000);let a=[W*.72,H*.68],b=[W*.29,H*.42];if(fx&&t-fx.t<300){let q=Math.sin((t-fx.t)/300*Math.PI)*45;if(fx.a===0)a[0]-=q;else b[0]+=q}actor(p,...a,2,-1);actor(e,...b,2,1);for(let [v,pos] of [[p,a],[e,b]]){label(name(v)+' Lv.'+v.lv,pos[0],pos[1]-86);rect(pos[0]-48,pos[1]-76,96,6,'#462d2b');rect(pos[0]-48,pos[1]-76,96*Math.max(0,v.hp/v.max),6,'#78c477');label(fmt(v.hp)+' / '+fmt(v.max),pos[0],pos[1]-58)}label('TURN '+turn,W/2,36,'#f9e1a1');if(fx&&t-fx.t<650){let pos=fx.a===0?b:a;label(fx.d?fmt(fx.d):'회피',pos[0],pos[1]-100-(t-fx.t)/30,'#ffcc83')}}else{terrain(2900,2300);if(p)actor(p,W/2,H/2,2)}requestAnimationFrame(frame)}function resetPad(){dx=dy=0;$('knob').style.transform=''}let pointer=null;function move(ev){let r=$('pad').getBoundingClientRect(),x=ev.clientX-r.left-r.width/2,y=ev.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=Math.max(1,l/44);dx=x/m/44;dy=y/m/44;$('knob').style.transform=`translate(${x/m}px,${y/m}px)`} $('pad').onpointerdown=ev=>{pointer=ev.pointerId;$('pad').setPointerCapture(pointer);move(ev)};$('pad').onpointermove=ev=>{if(ev.pointerId===pointer)move(ev)};$('pad').onpointerup=$('pad').onpointercancel=()=>{pointer=null;resetPad()};let keys=new Set();onkeydown=ev=>{if(mode!=='world')return;keys.add(ev.key);dx=+keys.has('ArrowRight')-+keys.has('ArrowLeft');dy=+keys.has('ArrowDown')-+keys.has('ArrowUp')};onkeyup=ev=>{keys.delete(ev.key);dx=+keys.has('ArrowRight')-+keys.has('ArrowLeft');dy=+keys.has('ArrowDown')-+keys.has('ArrowUp')};function openSheet2(which){if(mode!=='world'&&mode!=='sheet')re
